<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRAMORA Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:3px;font-size:22px}.muted{color:#9297a3;font-size:13px}.card{background:#11131a;border:1px solid #252a34;border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}input,textarea,select{width:100%;background:#080a0f;border:1px solid #2b303b;color:#fff;border-radius:10px;padding:12px;margin-top:6px}label{display:block;font-size:12px;color:#aeb3bd;margin-top:10px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#07080c}.secondary{background:#20242e;color:#fff}.danger{background:#4b1e26;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#20242e;font-size:11px}.item{border-top:1px solid #242832;padding:13px 0}.hidden{display:none}.msg{padding:10px;border-radius:9px;background:#171a22;color:#bfc4ce;font-size:12px;margin-top:10px}.ok{color:#7ff0a4}.bad{color:#ff9e9e}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">DRAMORA ADMIN</div><div class="muted">Content management</div></div><button class="secondary" id="logout">Sign out</button></div><div id="gate" class="card">Checking admin access…</div><main id="app" class="hidden"><div class="grid"><section class="card"><h2>Add series</h2><form id="seriesForm"><label>Title<input id="stitle" required></label><label>Slug<input id="sslug" required></label><label>Description<textarea id="sdesc"></textarea></label><label>Genres<input id="sgenre" placeholder="Romance, Drama"></label><label>Language<input id="slang" placeholder="Hindi"></label><label>Total episodes<input id="stotal" type="number" min="0" value="0"></label><label>Poster image<input id="sposter" type="file" accept="image/*"></label><label>Backdrop image<input id="sbackdrop" type="file" accept="image/*"></label><div class="row" style="margin-top:14px"><button class="primary">Create draft series</button></div></form><div id="seriesMsg"></div></section><section class="card"><h2>Add episode</h2><form id="episodeForm"><label>Series<select id="eseries" required></select></label><label>Episode number<input id="enum" type="number" min="1" required></label><label>Title<input id="etitle"></label><label>Description<textarea id="edesc"></textarea></label><label>Duration (seconds)<input id="edur" type="number" min="0"></label><label>Video file<input id="evideo" type="file" accept="video/*"></label><label>Or video URL<input id="eurl" type="url"></label><label>Thumbnail<input id="ethumb" type="file" accept="image/*"></label><button class="primary" style="margin-top:14px">Create draft episode</button></form><div id="episodeMsg"></div></section></div><section class="card"><div class="top"><h2>Catalogue</h2><button class="secondary" id="refresh">Refresh</button></div><div id="catalog"></div></section></main></div><script src="../config.js"></script><script>
const {createClient}=supabase;const sb=createClient(DRAMORA_CONFIG.SUPABASE_URL,DRAMORA_CONFIG.SUPABASE_KEY);const $=s=>document.querySelector(s);let user=null;
async function storage(file,bucket){if(!file)return null;const path=`${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false});if(error)throw error;return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl}
async function check(){const r=await sb.auth.getUser();user=r.data.user;if(!user){$('#gate').innerHTML='<b>Sign in required.</b>';return}const {data,error}=await sb.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(error||!data){$('#gate').innerHTML='<b>Admin access required.</b><div class="muted">Signed in as '+user.email+'</div>';return}$('#gate').innerHTML='<span class="ok">Admin verified.</span> '+user.email;$('#app').classList.remove('hidden');loadAll()}
async function loadAll(){const {data}=await sb.from('series').select('*').order('created_at',{ascending:false});window.series=data||[];$('#eseries').innerHTML=window.series.map(s=>`<option value="${s.id}">${s.title}</option>`).join('');$('#catalog').innerHTML=window.series.map(s=>`<div class="item"><b>${s.title}</b> <span class="pill">${s.status}</span> <span class="pill">${s.total_episodes} eps</span><div class="muted">${s.language||''} · ${(s.genre||[]).join(', ')}</div><div class="row" style="margin-top:8px"><button class="secondary" onclick="togglePublish('${s.id}','${s.status}')">${s.status==='published'?'Unpublish':'Publish'}</button><button class="danger" onclick="archive('${s.id}')">Archive</button><button class="secondary" onclick="episodes('${s.id}')">Episodes</button></div><div id="eps-${s.id}"></div></div>`).join('')||'<div class="muted">No series yet.</div>'}
async function togglePublish(id,status){await sb.from('series').update({status:status==='published'?'draft':'published'}).eq('id',id);loadAll()}
async function archive(id){await sb.from('series').update({status:'archived'}).eq('id',id);loadAll()}
async function episodes(id){const box=$('#eps-'+id);const {data}=await sb.from('episodes').select('*').eq('series_id',id).order('episode_number');box.innerHTML=(data||[]).map(e=>`<div class="item"><b>Ep ${e.episode_number}</b> ${e.title||''} <span class="pill">${e.is_published?'published':'draft'}</span><div class="row" style="margin-top:6px"><button class="secondary" onclick="pubEp('${e.id}',${e.is_published})">${e.is_published?'Unpublish':'Publish'}</button></div></div>`).join('')||'<div class="muted">No episodes.</div>'}
async function pubEp(id,p){await sb.from('episodes').update({is_published:!p}).eq('id',id);loadAll()}
$('#seriesForm').onsubmit=async e=>{e.preventDefault();try{const poster=await storage($('#sposter').files[0],'dramora-posters');const back=await storage($('#sbackdrop').files[0],'dramora-backdrops');const r=await sb.from('series').insert({slug:$('#sslug').value.trim(),title:$('#stitle').value.trim(),description:$('#sdesc').value.trim(),genre:$('#sgenre').value.split(',').map(x=>x.trim()).filter(Boolean),language:$('#slang').value.trim(),total_episodes:+$('#stotal').value||0,poster_url:poster,backdrop_url:back,status:'draft'});if(r.error)throw r.error;$('#seriesMsg').innerHTML='<span class="ok">Draft series created.</span>';e.target.reset();loadAll()}catch(x){$('#seriesMsg').innerHTML='<span class="bad">'+x.message+'</span>'}}
$('#episodeForm').onsubmit=async e=>{e.preventDefault();try{let video=$('#eurl').value.trim()||null;if($('#evideo').files[0])video=await storage($('#evideo').files[0],'dramora-videos');const thumb=await storage($('#ethumb').files[0],'dramora-thumbnails');const r=await sb.from('episodes').insert({series_id:$('#eseries').value,episode_number:+$('#enum').value,title:$('#etitle').value.trim(),description:$('#edesc').value.trim(),duration_seconds:+$('#edur').value||0,video_url:video,thumbnail_url:thumb,is_published:false});if(r.error)throw r.error;$('#episodeMsg').innerHTML='<span class="ok">Draft episode created.</span>';e.target.reset();loadAll()}catch(x){$('#episodeMsg').innerHTML='<span class="bad">'+x.message+'</span>'}}
$('#refresh').onclick=loadAll;$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};check();
</script></body></html>
