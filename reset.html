<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRAMORA — Reset password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}.card{background:#11131a;border:1px solid #252a34;border-radius:16px;padding:22px;width:100%;max-width:400px}h1{margin:0 0 6px;font-size:22px;letter-spacing:2px}.muted{color:#9297a3;font-size:13px}input{width:100%;background:#080a0f;border:1px solid #2b303b;color:#fff;border-radius:10px;padding:12px;margin-top:10px}button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:12px;font-weight:800;background:#fff;color:#07080c}#msg{margin-top:12px;font-size:13px}.bad{color:#ff9e9e}.ok{color:#7ff0a4}</style></head>
<body><div class="card"><h1>DRAMORA</h1><div class="muted">Choose a new password</div>
<form id="f"><input id="p1" type="password" minlength="8" placeholder="New password (8+ characters)" required autocomplete="new-password"><input id="p2" type="password" minlength="8" placeholder="Repeat new password" required autocomplete="new-password"><button>Update password</button></form><div id="msg" class="muted"></div></div>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(DRAMORA_CONFIG.SUPABASE_URL,DRAMORA_CONFIG.SUPABASE_KEY);const $=s=>document.querySelector(s);
let ready=false;
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'||ev==='SIGNED_IN')ready=true});
setTimeout(async()=>{const {data}=await sb.auth.getSession();if(data.session)ready=true;if(!ready)$('#msg').innerHTML='<span class="bad">Open this page from the link in your reset email.</span>'},1500);
$('#f').onsubmit=async e=>{e.preventDefault();const a=$('#p1').value,b=$('#p2').value;
 if(a!==b){$('#msg').innerHTML='<span class="bad">Passwords do not match.</span>';return}
 const {error}=await sb.auth.updateUser({password:a});
 $('#msg').innerHTML=error?'<span class="bad">'+error.message.replace(/</g,'&lt;')+'</span>':'<span class="ok">Password updated. You can now sign in to the app or admin page.</span>';
 if(!error)await sb.auth.signOut()};
</script></body></html>
